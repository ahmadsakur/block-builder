# Visit https://soloterm.com to learn more
name: bp-boilerplate
icon: null
processes:
  pnpm:build:
    command: pnpm run build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  pnpm:start:
    command: pnpm run start
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Next.js:
    command: pnpm run dev
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
